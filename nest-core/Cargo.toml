[package]
name = "nest-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Raster-based DXF part nesting core, compiled to WASM for the dxf-nester web app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats correctly rounded so JSON from the JS side
# yields bit-identical f64s (required for exact TS-engine equivalence).
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
